[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ssegnn"
version = "0.1.0"
description = "A project for spatial signal graph neural networks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch==2.1.2",
    "torch-scatter==2.1.2",
    "torch-sparse==0.6.18",
    "torch-cluster==1.6.3",
    "torch-geometric==2.4.0",
    "torch-geometric-temporal==0.54.0",
    "numpy==1.26.3",
    "pandas==1.3.5",
    "geopandas==0.10.2",
    "requests==2.31.0",
    "pyyaml==6.0.1",
    "tqdm==4.66.1",
    "fiona==1.9.6",
    "bottleneck>=1.3.6",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4.0",
]

[project.scripts]
ssegnn = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.hatch.build.targets.wheel]
packages = ["ssegnn"]

[tool.hatch.build]
include = [
    "configs/*.yaml",
    "datasets/labels.json",
    "datasets/signals.geojson"
]
exclude = [
    "configs/_test",
    "datasets/_old",
    "datasets/_test",
    "results/*"
]